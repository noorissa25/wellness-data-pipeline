name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dashboard,dev]"
      - name: Lint
        run: ruff check src tests dashboard
      - name: Unit and end-to-end tests
        run: pytest
      - name: Build every layer from synthetic data
        run: |
          python -m wellness generate
          python -m wellness run
          python -m wellness status
